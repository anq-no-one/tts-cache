<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Helvetica, Arial, sans-serif">
  <title>tts-cache architecture overview</title>
  <rect x="0" y="0" width="1200" height="800" fill="#f8fafc"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#0f172a">tts-cache architecture</text>
  <text x="30" y="58" font-size="13" fill="#475569">Consumer app with thin SDKs -&gt; Go proxy per-sentence pipeline -&gt; upstream synthesis, with fallback chain and two-region topology</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <g id="request-flow">
    <text x="30" y="88" font-size="13" font-weight="bold" fill="#0f172a">Request flow</text>

    <g id="consumer-app">
      <rect x="30" y="100" width="280" height="230" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
      <text x="46" y="126" font-size="14" font-weight="bold" fill="#0f172a">Consumer app</text>
      <text x="46" y="144" font-size="12" fill="#475569">thin SDKs: split, normalize,</text>
      <text x="46" y="160" font-size="12" fill="#475569">key prediction only (never hits)</text>
      <rect x="46" y="172" width="248" height="34" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="58" y="194" font-size="12" fill="#0f172a">Swift TTSClient</text>
      <rect x="46" y="212" width="248" height="34" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="58" y="234" font-size="12" fill="#0f172a">Kotlin contract (same vectors)</text>
      <rect x="46" y="252" width="248" height="34" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <text x="58" y="274" font-size="12" fill="#0f172a">JS Client (endpoints + directFetch)</text>
      <text x="46" y="308" font-size="12" fill="#475569">vectors/vectors.json + golden key</text>
      <text x="46" y="322" font-size="12" fill="#475569">v1-feab4a17bc7070e8 pin parity</text>
    </g>

    <line x1="310" y1="205" x2="424" y2="205" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="367" y="184" font-size="10" text-anchor="middle" fill="#0f172a">POST /v1/synthesize</text>
    <text x="367" y="197" font-size="10" text-anchor="middle" fill="#475569">Bearer app token</text>

    <g id="go-proxy">
      <rect x="430" y="100" width="430" height="230" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
      <text x="446" y="126" font-size="14" font-weight="bold" fill="#0f172a">Go proxy (stateless + CACHE_DIR volume)</text>
      <rect x="446" y="138" width="190" height="36" rx="5" fill="#fef9c3" stroke="#a16207" stroke-width="1"/>
      <text x="456" y="161" font-size="12" fill="#0f172a">1. split into sentences</text>
      <rect x="446" y="180" width="190" height="36" rx="5" fill="#fef9c3" stroke="#a16207" stroke-width="1"/>
      <text x="456" y="203" font-size="12" fill="#0f172a">2. cache lookup (disk LRU)</text>
      <rect x="446" y="222" width="190" height="36" rx="5" fill="#fef9c3" stroke="#a16207" stroke-width="1"/>
      <text x="456" y="245" font-size="12" fill="#0f172a">3. singleflight coalesce</text>
      <rect x="446" y="264" width="190" height="36" rx="5" fill="#fef9c3" stroke="#a16207" stroke-width="1"/>
      <text x="456" y="287" font-size="12" fill="#0f172a">4. upstream synthesis</text>
      <rect x="648" y="138" width="196" height="162" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="658" y="160" font-size="12" font-weight="bold" fill="#0f172a">Control plane</text>
      <text x="658" y="180" font-size="11" fill="#0f172a">POST /v1/register (invite)</text>
      <text x="658" y="198" font-size="11" fill="#0f172a">DELETE /v1/tokens/{id}</text>
      <text x="658" y="216" font-size="11" fill="#0f172a">GET /healthz -&gt; ok</text>
      <text x="658" y="234" font-size="11" fill="#0f172a">GET /metrics (JSON)</text>
      <text x="658" y="256" font-size="11" fill="#475569">auth: tokens.json hashes;</text>
      <text x="658" y="272" font-size="11" fill="#475569">admin token revokes only</text>
      <text x="658" y="292" font-size="11" fill="#475569">key: v1 + SHA-256, 6 fields</text>
      <text x="446" y="316" font-size="11" fill="#475569">per-sentence goroutines, concat in order;</text>
      <text x="446" y="328" font-size="11" fill="#475569">401 bad token, 413 overlong, 429 rate limit</text>
    </g>

    <line x1="860" y1="205" x2="912" y2="205" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="886" y="190" font-size="10" text-anchor="middle" fill="#0f172a">miss only</text>

    <g id="upstream">
      <rect x="918" y="100" width="252" height="230" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
      <text x="934" y="126" font-size="14" font-weight="bold" fill="#0f172a">Upstream provider</text>
      <text x="934" y="146" font-size="12" fill="#0f172a">ElevenLabs-compatible</text>
      <text x="934" y="162" font-size="12" fill="#475569">(Fish Audio by default)</text>
      <text x="934" y="186" font-size="12" fill="#0f172a">Synthesizer interface:</text>
      <text x="934" y="202" font-size="12" fill="#0f172a">2nd provider = 2nd struct,</text>
      <text x="934" y="218" font-size="12" fill="#0f172a">no server changes</text>
      <text x="934" y="244" font-size="12" fill="#475569">UPSTREAM_API_KEY, per-sentence</text>
      <text x="934" y="260" font-size="12" fill="#475569">timeout, whole-request 504</text>
    </g>

    <line x1="640" y1="330" x2="640" y2="398" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="652" y="360" font-size="11" fill="#0f172a">audio/mpeg: 200 all ok / 206 one failed / 502 all failed</text>
    <text x="652" y="376" font-size="11" fill="#0f172a">+ X-Sentence-Count, X-Sentence-Statuses, X-Region</text>
  </g>

  <g id="fallback-chain">
    <text x="30" y="414" font-size="13" font-weight="bold" fill="#0f172a">Fallback chain (client order, decision 0006 — proxy downtime costs money, never users)</text>
    <rect x="30" y="426" width="180" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="44" y="452" font-size="12" font-weight="bold" fill="#0f172a">1. device cache</text>
    <text x="44" y="470" font-size="11" fill="#475569">predicted key hit</text>
    <line x1="210" y1="461" x2="238" y2="461" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="242" y="426" width="180" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="256" y="452" font-size="12" font-weight="bold" fill="#0f172a">2. proxy regions</text>
    <text x="256" y="470" font-size="11" fill="#475569">in endpoint order</text>
    <line x1="422" y1="461" x2="450" y2="461" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="454" y="426" width="180" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="468" y="452" font-size="12" font-weight="bold" fill="#0f172a">3. direct provider</text>
    <text x="468" y="470" font-size="11" fill="#475569">app-owned key, reported</text>
    <line x1="634" y1="461" x2="662" y2="461" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="666" y="426" width="180" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="680" y="452" font-size="12" font-weight="bold" fill="#0f172a">4. system voice</text>
    <text x="680" y="470" font-size="11" fill="#475569">never silent</text>
    <text x="30" y="516" font-size="11" fill="#475569">SDK reports audio source with every result; proxy failures carry host, code, latency; failover on transport errors, timeouts, 429, 5xx only</text>
  </g>

  <g id="regions">
    <text x="30" y="548" font-size="13" font-weight="bold" fill="#0f172a">Two-region topology (decision 0007 — independent caches, no shared state)</text>
    <rect x="30" y="560" width="540" height="200" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <text x="46" y="586" font-size="13" font-weight="bold" fill="#0f172a">Region A: eu-west (REGION=eu-west)</text>
    <rect x="46" y="596" width="240" height="60" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/>
    <text x="58" y="618" font-size="12" fill="#0f172a">proxy stack (stateless)</text>
    <text x="58" y="636" font-size="11" fill="#475569">X-Region: eu-west</text>
    <rect x="298" y="596" width="240" height="60" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/>
    <text x="310" y="618" font-size="12" fill="#0f172a">disk cache A (tts-data)</text>
    <text x="310" y="636" font-size="11" fill="#475569">audio + tokens.json</text>
    <text x="46" y="678" font-size="12" fill="#0f172a">Same image, env-only config, one volume;</text>
    <text x="46" y="696" font-size="12" fill="#0f172a">rewarm from same upstream.</text>
    <text x="46" y="716" font-size="11" fill="#475569">Probes: GET /healthz latency picks fastest at start</text>
    <text x="46" y="734" font-size="11" fill="#475569">Second replica in-region needs shared storage (0009, not built)</text>

    <rect x="600" y="560" width="570" height="200" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <text x="616" y="586" font-size="13" font-weight="bold" fill="#0f172a">Region B: us-east (REGION=us-east)</text>
    <rect x="616" y="596" width="255" height="60" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/>
    <text x="628" y="618" font-size="12" fill="#0f172a">proxy stack (stateless)</text>
    <text x="628" y="636" font-size="11" fill="#475569">X-Region: us-east</text>
    <rect x="883" y="596" width="255" height="60" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/>
    <text x="895" y="618" font-size="12" fill="#0f172a">disk cache B (tts-data)</text>
    <text x="895" y="636" font-size="11" fill="#475569">audio + tokens.json</text>
    <text x="616" y="678" font-size="12" fill="#0f172a">SDK endpoint list: try A, fail over to B,</text>
    <text x="616" y="696" font-size="12" fill="#0f172a">then direct provider / system voice.</text>
    <text x="616" y="716" font-size="11" fill="#475569">metrics region label splits federated dashboards</text>
    <text x="616" y="734" font-size="11" fill="#475569">One region approx 99.5; fallback keeps feature alive</text>

    <line x1="570" y1="626" x2="600" y2="626" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="542" y="616" font-size="11" fill="#0f172a">failover</text>
  </g>

  <text x="30" y="784" font-size="11" fill="#64748b">Sources: docs/architecture.md, proxy/README.md, docs/deploy.md, decisions 0006 (fallback) and 0007 (regions). SDKs never decide cache hits.</text>
</svg>
