name: kotlin

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Kotlin compiler
        run: |
          set -euo pipefail
          KOTLIN_VERSION=2.0.21
          curl -fsSL -o /tmp/kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q /tmp/kotlin.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile and run contract checks
        run: |
          set -euo pipefail
          kotlinc src/main/kotlin/ttscache/TtsCache.kt src/test/kotlin/ttscache/ContractCheck.kt -include-runtime -d /tmp/tts-kotlin.jar
          java -jar /tmp/tts-kotlin.jar
