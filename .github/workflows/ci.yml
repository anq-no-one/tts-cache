name: ci

on:
  push:
  pull_request:

env:
  KOTLIN_VERSION: "2.0.21"

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Test
        run: go test -race -count=1 ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  swift:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Test
        run: npm test

  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Kotlin compiler
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q /tmp/kotlin.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile and run contract checks
        run: |
          set -euo pipefail
          kotlinc src/main/kotlin/ttscache/TtsCache.kt src/test/kotlin/ttscache/ContractCheck.kt -include-runtime -d /tmp/tts-kotlin.jar
          java -jar /tmp/tts-kotlin.jar
